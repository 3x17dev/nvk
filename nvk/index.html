<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N V K</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #000;
    }
    .audio-control {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 6px;
    }
    .audio-control button {
      background: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .audio-control {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: white;
    }
    .audio-control button {
      background: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
    .video-container {
      width: 100%;
      max-width: 1920px;
      padding: 0 20px;
      box-sizing: border-box;
    }
    video {
      width: 100%;
      max-width: 100%;
      height: auto;
      max-height: 90vh;
      display: block;
    }
    .title-overlay {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 2;
    }
    .subtitle {
      color: white;
      font-size: 1.2rem;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-family: Arial, sans-serif;
    }
    #play-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      pointer-events: none;
    }
    #play-btn {
      pointer-events: auto;
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      display: none;
      background: white;
    }
  </style>
</head>
<body>
  <div class="audio-control">
    <button id="audio-toggle">🔇 Sound Off</button>
  </div>

  <audio id="background-music" loop>
    <source src="media/nvk/deuntje.mp3" type="audio/mpeg">
  </audio>

  <div class="video-container">
    <video autoplay muted loop playsinline poster="media/nvk/lgo.png">
      <source src="media/nvk/xxxx.mp4" type="video/mp4">
    </video>
    <div class="title-overlay">
      <p class="subtitle">Nieuw-Vlaemsche Kunst</p>
    </div>
  </div>

  <div id="play-overlay">
    <button id="play-btn">Play video</button>
  </div>
  
    <script>
      (function(){
        const video = document.querySelector('video');
        const audio = document.getElementById('background-music');
        const playBtn = document.getElementById('play-btn');
        const overlay = document.getElementById('play-overlay');
        const audioToggle = document.getElementById('audio-toggle');
        let audioEnabled = false;

        function showPlayButton() {
          playBtn.style.display = 'inline-block';
          overlay.style.pointerEvents = 'auto';
        }

        function hidePlayButton() {
          playBtn.style.display = 'none';
          overlay.style.pointerEvents = 'none';
        }

        function tryPlay() {
          const p = video.play();
          if (p && typeof p.then === 'function') {
            p.then(() => {
              hidePlayButton();
            }).catch(() => {
              showPlayButton();
            });
          }
        }

        playBtn.addEventListener('click', function(){
          video.muted = true;
          video.play().then(hidePlayButton).catch(()=>{});
        });

        audioToggle.addEventListener('click', function() {
          audioEnabled = !audioEnabled;
          if (audioEnabled) {
            audio.play();
            audioToggle.textContent = '🔊 Sound On';
          } else {
            audio.pause();
            audioToggle.textContent = '🔇 Sound Off';
          }
        });

        tryPlay();
        document.addEventListener('click', tryPlay, { once: true });
      })();
    </script>
</body>
</html>
