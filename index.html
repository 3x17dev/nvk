<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N V K</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      position: relative;
      overflow: hidden;
    }
    .bg-video {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: 1;
      object-fit: cover;
    }
    .glitch-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 20px;
    }
    .subtitle {
      color: white;
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0;
      position: relative;
      z-index: 3;
      text-align: center;
      order: -1; /* This moves the subtitle to the top */
    }
    .audio-control {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 6px;
    }
    .audio-control button {
      background: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    #play-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      pointer-events: none;
    }
    #play-btn {
      pointer-events: auto;
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      display: none;
      background: white;
    }
    @media (max-width: 768px) {
      .bg-video {
        width: 100%;
        height: 100%;
      }
      .glitch-wrap {
        width: 90%;
        max-width: 400px;
      }
      .logo {
        max-width: 80%;
        height: auto;
      }
    }
  </style>
</head>
<body>
  <div class="audio-control">
    <button id="audio-toggle">� Sound On</button>
  </div>

  <audio id="background-music" loop autoplay>
    <source src="media/nvk/deuntje.mp3" type="audio/mpeg">
  </audio>

  <!-- Background video -->
  <video class="bg-video" autoplay muted loop playsinline poster="media/nvk/lgo.png">
    <source src="media/nvk/xxxx.mp4" type="video/mp4">
  </video>
  
  <!-- A lightweight overlay prompting interaction when autoplay is blocked -->
  <div id="play-overlay" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;pointer-events:none;">
    <button id="play-btn" style="pointer-events:auto;padding:0.8rem 1.2rem;font-size:1rem;border-radius:6px;border:none;cursor:pointer;display:none;">Play background</button>
  </div>

  <div class="glitch-wrap">
    <p class="subtitle">Nieuw-Vlaemsche Kunst</p>
    <img src="media/nvk/lgo.png" alt="NVK top logo" class="logo top-logo">
    <h1 class="glitch" data-text="NVK">NVK</h1>
    <img src="media/nvk/nvk.png" alt="NVK bottom" class="logo bottom-logo">
  </div>
  
    <script>
      (function(){
        const video = document.querySelector('.bg-video');
        const audio = document.getElementById('background-music');
        const playBtn = document.getElementById('play-btn');
        const overlay = document.getElementById('play-overlay');
        const audioToggle = document.getElementById('audio-toggle');
        let audioEnabled = true; // Start with audio enabled

        // Use an existing logo as a poster so something shows if video can't load
        const poster = 'media/nvk/lgo.png';
        video.setAttribute('poster', poster);

        function showPlayButton() {
          playBtn.style.display = 'inline-block';
          overlay.style.pointerEvents = 'auto';
        }

        function hidePlayButton() {
          playBtn.style.display = 'none';
          overlay.style.pointerEvents = 'none';
        }

        function tryPlayVideo() {
          const p = video.play();
          if (p && typeof p.then === 'function') {
            p.then(() => {
              hidePlayButton();
            }).catch(() => {
              // Autoplay blocked — show UI so the user can start it
              showPlayButton();
            });
          }
        }

        function tryPlayAudio() {
          const p = audio.play();
          if (p && typeof p.then === 'function') {
            p.then(() => {
              audioEnabled = true;
              audioToggle.textContent = '🔊 Sound On';
            }).catch(() => {
              // If autoplay is blocked, we'll need user interaction
              audioEnabled = false;
              audioToggle.textContent = '🔇 Sound Off';
            });
          }
        }

        playBtn.addEventListener('click', function(){
          video.muted = true; // ensure muted so play is allowed
          video.play().then(hidePlayButton).catch(()=>{});
          tryPlayAudio(); // Try to play audio when user interacts
        });

        audioToggle.addEventListener('click', function() {
          audioEnabled = !audioEnabled;
          if (audioEnabled) {
            audio.play();
            audioToggle.textContent = '🔊 Sound On';
          } else {
            audio.pause();
            audioToggle.textContent = '🔇 Sound Off';
          }
        });

        // Try to play both video and audio immediately
        tryPlayVideo();
        tryPlayAudio();
        
        // Try again after first user interaction
        document.addEventListener('click', function() {
          tryPlayVideo();
          tryPlayAudio();
        }, { once: true });
      })();
    </script>
</body>
</html>
