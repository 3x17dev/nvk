<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Feestboek</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin:0; padding:0; background:#fff; }
    #editor {
      width: min(1100px, 100%);
      margin: 32px auto;
      padding: 16px;
      min-height: 65vh;
      line-height: 1.5;
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div id="editor" contenteditable="true" spellcheck="false"
       placeholder="Typ hier…"></div>

  <!-- Yjs + y-websocket via ESM CDN -->
  <script type="module">
    import * as Y from "https://cdn.skypack.dev/yjs@13.6.15";
    import { WebsocketProvider } from "https://cdn.skypack.dev/y-websocket@1.5.4";

    const docName = "feestboek";
    const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://")
                + location.host + "/feestboek-ws";

    const ydoc = new Y.Doc();
    const ytext = ydoc.getText("t");
    const provider = new WebsocketProvider(wsUrl, docName, ydoc, { connect: true });

    const el = document.getElementById("editor");

    // Apply remote changes to DOM
    const render = () => { el.textContent = ytext.toString(); };
    ytext.observe(render);
    render();

    // Push DOM edits to Yjs
    let composing = false;
    const syncFromDom = () => {
      if (composing) return;
      composing = true;
      ytext.delete(0, ytext.length);
      ytext.insert(0, el.textContent);
      composing = false;
    };
    el.addEventListener("input", syncFromDom);
    // Keep caret friendly: reflect remote updates without stealing focus
    provider.awareness.setLocalStateField("cursor", { t: Date.now() });
  </script>
</body>
</html>
