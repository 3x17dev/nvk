<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Feestboek</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; }
    textarea { width: 100%; height: 60vh; }
    .status { margin: 8px 0; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Feestboek</h1>
  <div class="status" id="status">Connecting…</div>
  <textarea id="box" placeholder="Start typing with your friends…"></textarea>

  <script type="module">
    // Yjs + y-websocket (browser ESM builds)
    import * as Y from 'https://unpkg.com/yjs@13.6.18/dist/yjs.mjs';
    import { WebsocketProvider } from 'https://unpkg.com/y-websocket@1.5.4/dist/y-websocket.js?module';

    // Document
    const ydoc = new Y.Doc();
    const room = 'feestboek';

    // WebSocket endpoint exposed by Caddy:
    //   handle_path /feestboek/ws* { reverse_proxy 127.0.0.1:7777 }
    const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/feestboek/ws';

    const provider = new WebsocketProvider(wsUrl, room, ydoc);
    const ytext = ydoc.getText('t');

    const textarea = document.getElementById('box');
    const statusEl = document.getElementById('status');

    // Update connection status
    const setStatus = (s) => statusEl.textContent = s;
    provider.on('status', ({ status }) => setStatus(status === 'connected' ? 'Connected' : 'Disconnected'));
    setStatus('Connecting…');

    // Initialize local view from shared state
    textarea.value = ytext.toString();

    // App
